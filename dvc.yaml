stages:

  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/raw

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw
    params:
      - preprocess.test_size
      - preprocess.random_state
    outs:
      - data/processed

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed
    params:
      - train.epochs
      - train.batch_size
      - train.hidden_units
      - train.dropout
    outs:
      - models

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models
      - data/processed
    metrics:
      - metrics/metrics.json
    outs:
      - metrics/confusion_matrix.png